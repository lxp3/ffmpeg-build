name: Build FFmpeg

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      build_linux: ${{ steps.parse.outputs.build_linux }}
      build_macos: ${{ steps.parse.outputs.build_macos }}
      build_wasm: ${{ steps.parse.outputs.build_wasm }}
      build_windows: ${{ steps.parse.outputs.build_windows }}
      linux_matrix: ${{ steps.parse.outputs.linux_matrix }}
      macos_matrix: ${{ steps.parse.outputs.macos_matrix }}
      windows_matrix: ${{ steps.parse.outputs.windows_matrix }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

          BUILD_LINUX=false
          LINUX_ARCH=all
          BUILD_MACOS=false
          MACOS_ARCH=all
          BUILD_WASM=false
          BUILD_WINDOWS_MSVC_STATIC=false
          BUILD_WINDOWS_MINGW_STATIC=false
          BUILD_WINDOWS_MINGW_SHARED=false
          WINDOWS_ARCH=all

          if [[ "$TAG" == *-macos-x86_64 ]]; then
            BUILD_MACOS=true
            MACOS_ARCH=x86_64
          elif [[ "$TAG" == *-macos-aarch64 ]]; then
            BUILD_MACOS=true
            MACOS_ARCH=aarch64
          elif [[ "$TAG" == *-macos ]]; then
            BUILD_MACOS=true
          elif [[ "$TAG" == *-window-aarch64 ]]; then
            BUILD_WINDOWS_MSVC_STATIC=true
            BUILD_WINDOWS_MINGW_STATIC=true
            BUILD_WINDOWS_MINGW_SHARED=true
            WINDOWS_ARCH=aarch64
          elif [[ "$TAG" == *-window-x86_64 ]]; then
            BUILD_WINDOWS_MSVC_STATIC=true
            BUILD_WINDOWS_MINGW_STATIC=true
            BUILD_WINDOWS_MINGW_SHARED=true
            WINDOWS_ARCH=x86_64
          elif [[ "$TAG" == *-window-msvc-0-aarch64 ]]; then
            BUILD_WINDOWS_MSVC_STATIC=true
            WINDOWS_ARCH=aarch64
          elif [[ "$TAG" == *-window-msvc-0-x86_64 ]]; then
            BUILD_WINDOWS_MSVC_STATIC=true
            WINDOWS_ARCH=x86_64
          elif [[ "$TAG" == *-window-mingw-0-aarch64 ]]; then
            BUILD_WINDOWS_MINGW_STATIC=true
            WINDOWS_ARCH=aarch64
          elif [[ "$TAG" == *-window-mingw-0-x86_64 ]]; then
            BUILD_WINDOWS_MINGW_STATIC=true
            WINDOWS_ARCH=x86_64
          elif [[ "$TAG" == *-window-mingw-1-aarch64 ]]; then
            BUILD_WINDOWS_MINGW_SHARED=true
            WINDOWS_ARCH=aarch64
          elif [[ "$TAG" == *-window-mingw-1-x86_64 ]]; then
            BUILD_WINDOWS_MINGW_SHARED=true
            WINDOWS_ARCH=x86_64
          elif [[ "$TAG" == *-window-msvc-0 ]]; then
            BUILD_WINDOWS_MSVC_STATIC=true
          elif [[ "$TAG" == *-window-mingw-0 ]]; then
            BUILD_WINDOWS_MINGW_STATIC=true
          elif [[ "$TAG" == *-window-mingw-1 ]]; then
            BUILD_WINDOWS_MINGW_SHARED=true
          elif [[ "$TAG" == *-window ]]; then
            BUILD_WINDOWS_MSVC_STATIC=true
            BUILD_WINDOWS_MINGW_STATIC=true
            BUILD_WINDOWS_MINGW_SHARED=true
          elif [[ "$TAG" == *-aarch64 ]]; then
            BUILD_LINUX=true
            LINUX_ARCH=aarch64
          elif [[ "$TAG" == *-linux ]]; then
            BUILD_LINUX=true
            BUILD_WASM=true
          elif [[ "$TAG" == *-wasm ]]; then
            BUILD_WASM=true
          else
            BUILD_LINUX=true
            BUILD_WASM=true
            BUILD_MACOS=true
            BUILD_WINDOWS_MSVC_STATIC=true
            BUILD_WINDOWS_MINGW_STATIC=true
            BUILD_WINDOWS_MINGW_SHARED=true
          fi

          BUILD_WINDOWS=false
          if [ "$BUILD_WINDOWS_MSVC_STATIC" = "true" ] || [ "$BUILD_WINDOWS_MINGW_STATIC" = "true" ] || [ "$BUILD_WINDOWS_MINGW_SHARED" = "true" ]; then
            BUILD_WINDOWS=true
          fi

          linux_matrix="$(
            jq -cn --arg arch "$LINUX_ARCH" '
              [
                {arch:"x86_64", runner:"ubuntu-latest", docker_platform:"linux/amd64", container_image:"quay.io/pypa/manylinux2014_x86_64", enable_shared:0, lib_type:"static"},
                {arch:"x86_64", runner:"ubuntu-latest", docker_platform:"linux/amd64", container_image:"quay.io/pypa/manylinux2014_x86_64", enable_shared:1, lib_type:"shared"},
                {arch:"aarch64", runner:"ubuntu-24.04-arm", docker_platform:"linux/arm64", container_image:"quay.io/pypa/manylinux2014_aarch64", enable_shared:0, lib_type:"static"},
                {arch:"aarch64", runner:"ubuntu-24.04-arm", docker_platform:"linux/arm64", container_image:"quay.io/pypa/manylinux2014_aarch64", enable_shared:1, lib_type:"shared"}
              ] | if $arch == "all" then . else map(select(.arch == $arch)) end | {include:.}
            '
          )"
          macos_matrix="$(
            jq -cn --arg arch "$MACOS_ARCH" '
              [
                {arch:"x86_64", runner:"macos-15-intel", enable_shared:0, lib_type:"static"},
                {arch:"x86_64", runner:"macos-15-intel", enable_shared:1, lib_type:"shared"},
                {arch:"aarch64", runner:"macos-15", enable_shared:0, lib_type:"static"},
                {arch:"aarch64", runner:"macos-15", enable_shared:1, lib_type:"shared"}
              ] | if $arch == "all" then . else map(select(.arch == $arch)) end | {include:.}
            '
          )"
          windows_matrix="$(
            jq -cn \
              --arg arch "$WINDOWS_ARCH" \
              --arg msvc "$BUILD_WINDOWS_MSVC_STATIC" \
              --arg mingw_static "$BUILD_WINDOWS_MINGW_STATIC" \
              --arg mingw_shared "$BUILD_WINDOWS_MINGW_SHARED" '
              [
                {output_key:"build_windows_msvc_static", toolchain:"msvc", enable_shared:0, lib_type:"static", arch:"x86_64", runner:"windows-latest", artifact_name:"ffmpeg-windows-x86_64-msvc-static", artifact_glob:"outputs/*-static-x86_64-msvc.tar.gz"},
                {output_key:"build_windows_msvc_static", toolchain:"msvc", enable_shared:0, lib_type:"static", arch:"aarch64", runner:"windows-11-arm", artifact_name:"ffmpeg-windows-aarch64-msvc-static", artifact_glob:"outputs/*-static-aarch64-msvc.tar.gz"},
                {output_key:"build_windows_mingw_static", toolchain:"mingw", enable_shared:0, lib_type:"static", arch:"x86_64", runner:"windows-latest", msystem:"MINGW64", package_prefix:"mingw-w64-x86_64", artifact_name:"ffmpeg-windows-x86_64-mingw-static", artifact_glob:"outputs/*-static-x86_64-w64-mingw32.tar.gz"},
                {output_key:"build_windows_mingw_static", toolchain:"mingw", enable_shared:0, lib_type:"static", arch:"aarch64", runner:"windows-11-arm", msystem:"CLANGARM64", package_prefix:"mingw-w64-clang-aarch64", artifact_name:"ffmpeg-windows-aarch64-mingw-static", artifact_glob:"outputs/*-static-aarch64-w64-mingw32.tar.gz"},
                {output_key:"build_windows_mingw_shared", toolchain:"mingw", enable_shared:1, lib_type:"shared", arch:"x86_64", runner:"windows-latest", msystem:"MINGW64", package_prefix:"mingw-w64-x86_64", artifact_name:"ffmpeg-windows-x86_64-mingw-shared", artifact_glob:"outputs/*-shared-x86_64-w64-mingw32.tar.gz"},
                {output_key:"build_windows_mingw_shared", toolchain:"mingw", enable_shared:1, lib_type:"shared", arch:"aarch64", runner:"windows-11-arm", msystem:"CLANGARM64", package_prefix:"mingw-w64-clang-aarch64", artifact_name:"ffmpeg-windows-aarch64-mingw-shared", artifact_glob:"outputs/*-shared-aarch64-w64-mingw32.tar.gz"}
              ] | map(select(
                ($arch == "all" or .arch == $arch) and
                ((.output_key == "build_windows_msvc_static" and $msvc == "true") or
                 (.output_key == "build_windows_mingw_static" and $mingw_static == "true") or
                 (.output_key == "build_windows_mingw_shared" and $mingw_shared == "true"))
              )) | {include:.}
            '
          )"

          {
            echo "build_linux=$BUILD_LINUX"
            echo "build_macos=$BUILD_MACOS"
            echo "build_wasm=$BUILD_WASM"
            echo "build_windows=$BUILD_WINDOWS"
            echo "linux_matrix=$linux_matrix"
            echo "macos_matrix=$macos_matrix"
            echo "windows_matrix=$windows_matrix"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: parse-tag
    if: needs.parse-tag.outputs.build_linux == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      matrix: ${{ needs.parse-tag.outputs.linux_matrix }}

  build-wasm:
    needs: parse-tag
    if: needs.parse-tag.outputs.build_wasm == 'true'
    uses: ./.github/workflows/build-wasm.yml

  build-macos:
    needs: parse-tag
    if: needs.parse-tag.outputs.build_macos == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      matrix: ${{ needs.parse-tag.outputs.macos_matrix }}

  build-windows:
    needs: parse-tag
    if: needs.parse-tag.outputs.build_windows == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      matrix: ${{ needs.parse-tag.outputs.windows_matrix }}

  release:
    needs: [parse-tag, build-linux, build-wasm, build-macos, build-windows]
    if: |
      always() &&
      !contains(join(needs.*.result, ','), 'failure') &&
      !contains(join(needs.*.result, ','), 'cancelled') &&
      contains(join(needs.*.result, ','), 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -name "*.tar.gz"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
